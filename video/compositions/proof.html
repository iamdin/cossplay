    const tl = gsap.timeline({ paused: true })
    const cam = (s, fx, fy, cx = 1260, cy = 540) => ({
      scale: s,
      x: cx - 120 - s * fx,
      y: cy - 118 - s * fy,
    })
    const show = (kind, name, at) => {
      tl.set(".pf-" + kind, { opacity: 0 }, at)
      tl.set("#pf-" + kind + "-" + name, { opacity: 1 }, at)
    }
    const click = (at) => {
      tl.to(
        "#pf-cur",
        { scale: 0.86, duration: 0.07, ease: "power2.in" },
        at - 0.07
      )
      tl.to("#pf-cur", { scale: 1, duration: 0.18, ease: "power2.out" }, at)
    }
    const words = (id, at) =>
      tl.fromTo(
        id + " b",
        { opacity: 0, filter: "blur(6px)" },
        {
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.13,
          stagger: 0.07,
          ease: "power4.out",
        },
        at
      )
    const out = (id, at) =>
      tl.to(
        id + " b",
        {
          opacity: 0,
          filter: "blur(8px)",
          duration: 0.16,
          stagger: 0.03,
          ease: "power3.in",
        },
        at
      )
    const LENS = "inset(90px 80px 90px 680px round 20px)"

    show("site", "tangerine", 0)
    show("panel", "tangerine", 0)
    tl.fromTo(
      "#pf-cur",
      { x: 2000, y: 1100, scale: 1 },
      { x: 2000, y: 1100, duration: 0.01 },
      0
    )
    // From the whole window into the lens.
    tl.fromTo(
      "#pf-win",
      { ...cam(1, 840, 422, 960, 540), filter: "blur(0px)" },
      { ...cam(1.3, 1300, 300), duration: 0.55, ease: "power2.inOut" },
      0
    )
    tl.fromTo(
      "#pf-stage",
      { clipPath: "inset(0px 0px 0px 0px round 0px)" },
      { clipPath: LENS, duration: 0.55, ease: "power2.inOut" },
      0
    )
    tl.fromTo("#pf-frame", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3)

    // 1. Dark.
    words("#pf-p1", 0.2)
    tl.to(
      "#pf-cur",
      { x: 1483, y: 279, duration: 0.42, ease: "power3.out" },
      0.12
    )
    click(0.6)
    show("site", "tangerine-dark", 0.6)
    show("panel", "tangerine-dark", 0.6)
    out("#pf-p1", 2.2)

    // 2. Tune: back to light, then drag Primary's hue across nine real frames.
    words("#pf-p2", 2.45)
    click(2.4)
    show("site", "hue-0", 2.4)
    show("panel", "hue-0", 2.4)
    tl.to(
      "#pf-win",
      { ...cam(2.0, 1512, 304), duration: 0.5, ease: "power2.inOut" },
      2.5
    )
    tl.to(
      "#pf-cur",
      { x: 1041, y: 539, duration: 0.5, ease: "power2.inOut" },
      2.5
    )
    click(3.12)
    tl.to("#pf-cur", { x: 1303, duration: 0.95, ease: "none" }, 3.15)
    for (let i = 0; i <= 8; i++) {
      show("site", "hue-" + i, 3.15 + i * 0.115)
      show("panel", "hue-" + i, 3.15 + i * 0.115)
    }
    tl.to("#pf-cur", { y: 1150, duration: 0.35, ease: "power3.in" }, 4.15)
    tl.to(
      "#pf-win",
      { ...cam(2.2, 75, 402), duration: 0.38, ease: "power3.inOut" },
      4.2
    )
    tl.to(
      "#pf-win",
      { filter: "blur(16px)", duration: 0.19, ease: "power2.in" },
      4.2
    )
    tl.to(
      "#pf-win",
      { filter: "blur(0px)", duration: 0.19, ease: "power2.out" },
      4.39
    )
    out("#pf-p2", 4.6)

    // 3. Inspect the button.
    words("#pf-p3", 4.85)
    tl.to(
      "#pf-win",
      { ...cam(1.45, 330, 450), duration: 0.5, ease: "power2.inOut" },
      4.8
    )
    tl.set("#pf-cur", { x: 1150, y: 1100 }, 4.9)
    tl.to(
      "#pf-cur",
      { x: 900, y: 476, duration: 0.42, ease: "power3.out" },
      4.95
    )
    show("site", "inspect", 5.4)
    show("panel", "inspect", 5.4)
    out("#pf-p3", 7.0)

    // 4. Export.
    words("#pf-p4", 7.25)
    tl.to(
      "#pf-win",
      { ...cam(1.6, 1580, 744), duration: 0.45, ease: "power2.inOut" },
      7.2
    )
    tl.to(
      "#pf-cur",
      { x: 1351, y: 665, duration: 0.45, ease: "power2.inOut" },
      7.25
    )
    click(7.8)
    show("panel", "export", 7.8)
    tl.to(
      "#pf-cur",
      { x: 2000, y: 1150, duration: 0.4, ease: "power3.in" },
      8.0
    )
    tl.to(
      "#pf-win",
      { ...cam(1.75, 1480, 360), duration: 0.6, ease: "power2.inOut" },
      8.1
    )
    out("#pf-p4", 9.05)
    tl.to(
      "#pf-stage",
      {
        clipPath: "inset(0px 0px 0px 0px round 0px)",
        duration: 0.4,
        ease: "power3.in",
      },
      9.2
    )
    tl.to("#pf-frame", { opacity: 0, duration: 0.15 }, 9.2)
