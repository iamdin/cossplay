  <script>
    const tl = gsap.timeline({ paused: true })
    const words = (sel, at) =>
      tl.fromTo(
        sel + " b",
        { opacity: 0, filter: "blur(6px)" },
        {
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.13,
          stagger: 0.07,
          ease: "power4.out",
        },
        at
      )
    const out = (sel, at) =>
      tl.to(
        sel + " b",
        {
          opacity: 0,
          filter: "blur(8px)",
          duration: 0.16,
          stagger: 0.03,
          ease: "power3.in",
        },
        at
      )
    tl.fromTo(
      ["#ow-t1 b", "#ow-t2 b", "#ow-t3 b"],
      { opacity: 0 },
      { opacity: 0, duration: 0.01 },
      0
    )
    // The card arrives from the right as the hook whips out; the list scrolls up through all 42 lines.
    tl.fromTo(
      "#ow-card",
      { x: 700, filter: "blur(14px)" },
      { x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
      0
    )
    tl.fromTo(
      "#ow-list",
      { y: -1268 },
      { y: 0, duration: 1.8, ease: "power2.inOut" },
      0.05
    )
    words("#ow-t1", 0.25)
    out("#ow-t1", 1.95)
    words("#ow-t2", 2.15)
    tl.to("#ow-hl", { opacity: 1, duration: 0.15 }, 2.0)
    tl.set("#ow-caret", { opacity: 1 }, 2.1)
    const o = Array.from(document.querySelectorAll("#ow-val .o"))
    const n = Array.from(document.querySelectorAll("#ow-val .n"))
    o.slice()
      .reverse()
      .forEach((el, i) => tl.set(el, { display: "none" }, 2.3 + i * 0.03))
    n.forEach((el, i) => tl.set(el, { display: "inline" }, 3.15 + i * 0.075))
    out("#ow-t2", 4.15)
    words("#ow-t3", 4.4)
    // Reload: the edit is gone.
    tl.set("#ow-hl", { backgroundColor: "#fecaca" }, 4.8)
    n.forEach((el) => tl.set(el, { display: "none" }, 4.8))
    o.forEach((el) => tl.set(el, { display: "inline" }, 4.8))
    tl.set("#ow-caret", { opacity: 0 }, 4.8)
    tl.to("#ow-hl", { opacity: 0, duration: 0.5, ease: "power2.out" }, 5.0)
    out("#ow-t3", 5.55)
    // The card heads for the side panel's place in the window: 1400,162 at 400 x 800.
    tl.to("#ow-inner", { opacity: 0, duration: 0.18, ease: "power2.in" }, 5.6)
    tl.to(
      "#ow-card",
      {
        x: 440,
        y: 42,
        scaleX: 400 / 840,
        scaleY: 800 / 840,
        duration: 0.4,
        ease: "power3.inOut",
      },
      5.6
    )
    window.__timelines["oldway"] = tl
  </script>
