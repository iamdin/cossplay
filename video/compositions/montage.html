  <script>
    const tl = gsap.timeline({ paused: true })
    // Four real coss ui pages, 0.397x in a 2x2 grid; the title is on screen from the first frame.
    const S = 0.397
    tl.fromTo(
      ".mw",
      { scale: S, x: 0, y: 0, opacity: 1, filter: "blur(0px)" },
      { scale: S * 1.02, duration: 5.4, ease: "none" },
      0
    )
    tl.fromTo(
      "#mt-title b",
      { opacity: 1, filter: "blur(0px)" },
      { opacity: 1, duration: 0.01 },
      0
    )
    tl.fromTo(
      ".mw img:not([id$='-0'])",
      { opacity: 0 },
      { opacity: 0, duration: 0.01 },
      0
    )
    // Every beat (0.6 s at 100 BPM) each site takes another preset, light and dark alternating; a small ripple across the grid.
    for (let k = 1; k <= 8; k++)
      for (let w = 0; w < 4; w++) {
        const at = k * 0.6 + w * 0.04
        tl.set(`#mt-w${w} img`, { opacity: 0 }, at)
        tl.set(`#mt-${w}-${k}`, { opacity: 1 }, at)
        tl.fromTo(
          `#mt-w${w}`,
          { y: -6 },
          { y: 0, duration: 0.2, ease: "power2.out", immediateRender: false },
          at
        )
      }
    // Out: the title blurs away and the grid collapses toward the panel that opens the reveal.
    tl.to(
      "#mt-title b",
      {
        opacity: 0,
        filter: "blur(8px)",
        duration: 0.16,
        stagger: 0.02,
        ease: "power3.in",
      },
      5.4
    )
    tl.to(
      ".mw",
      {
        x: (i) => [1400 - 760, 1400 - 1292, 1400 - 760, 1400 - 1292][i] + 40,
