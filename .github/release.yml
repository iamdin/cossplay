changelog:
  exclude:
    labels:
      - "skip-release-notes"
    authors:
      - "dependabot"
  categories:
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "Docs"
      labels:
        - "docs"
    - title: "Chore"
      labels:
        - "chore"
    - title: "Other Changes"
      labels:
        - "*"
