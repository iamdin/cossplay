name: Code check

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format
      - run: pnpm run lint
      - run: pnpm run check:type
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm --filter @cossplay/extension exec playwright install --with-deps chromium
      # The extension loads only in headed Chromium, so it runs on a virtual display.
      - run: xvfb-run -a pnpm run test:e2e
