name: Build and Release Chrome Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  CI: "true"

jobs:
  build-release:
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, rn, cossplay]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build chrome extension
        run: pnpm build

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            VERSION=$(node -p "require('./apps/extension/package.json').version")
            echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Package extension
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          root = "apps/extension/dist"
          output = f"apps/extension/cossplay-{os.environ['RELEASE_TAG']}.zip"
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for dirpath, _dirnames, filenames in os.walk(root):
                  for filename in filenames:
                      path = os.path.join(dirpath, filename)
                      archive.write(path, os.path.relpath(path, root).replace(os.sep, "/"))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: apps/extension/cossplay-${{ env.RELEASE_TAG }}.zip
          generate_release_notes: true
